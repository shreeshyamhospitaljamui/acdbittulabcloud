<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07172d">
<title>ACD BITTU LAB CLOUD — Login &amp; Lab Owner Portal</title>
<link rel="manifest" href="manifest.webmanifest">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#07172d;--blue:#0866df;--ink:#18263a;--muted:#667085;--line:#dce3eb;--bg:#f1f5f9;--green:#078447;--red:#b42318}
*{box-sizing:border-box;font-family:'Segoe UI',Inter,Arial,sans-serif}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#07172d 0%,#0e2d56 55%,#07172d 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;color:var(--ink)}

/* Animated Shimmer & Sparkle Festival Banner */
.festival-ribbon{width:100%;max-width:480px;margin-bottom:14px;border-radius:14px;padding:12px 16px;text-align:center;color:#fff;position:relative;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.35);border:1.5px solid rgba(255,255,255,.45);display:none;animation:festFloat 3s ease-in-out infinite}
.festival-ribbon::before{content:"";position:absolute;top:0;left:-120%;width:90%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.38),transparent);transform:skewX(-22deg);animation:festShine 2.8s infinite}
.fest-theme-diwali{background:linear-gradient(135deg,#b45309,#ea580c,#d97706)}
.fest-theme-durga{background:linear-gradient(135deg,#991b1b,#dc2626,#b91c1c)}
.fest-theme-holi{background:linear-gradient(135deg,#7e22ce,#db2777,#2563eb)}
.fest-theme-eid{background:linear-gradient(135deg,#065f46,#059669,#0d9488)}
.fest-theme-gold{background:linear-gradient(135deg,#1e3a8a,#1d4ed8,#0284c7)}
.fest-title{font-size:15px;font-weight:800;letter-spacing:.3px;text-shadow:0 2px 6px rgba(0,0,0,.35)}
.fest-sub{font-size:12px;opacity:.95;margin-top:3px}
.fest-sparkle{display:inline-block;animation:festPulse 1.3s alternate infinite}
@keyframes festShine{0%{left:-120%}65%,100%{left:160%}}
@keyframes festFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes festPulse{from{transform:scale(.92);opacity:.85}to{transform:scale(1.18);opacity:1}}

.card{width:100%;max-width:440px;background:#fff;border-radius:16px;padding:28px 26px;box-shadow:0 24px 60px rgba(0,0,0,.38)}
.head{text-align:center;margin-bottom:18px}
.pill-top{display:inline-block;background:#eff6ff;color:var(--blue);font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;letter-spacing:.4px}
.head h1{margin:8px 0 4px;font-size:21px;color:var(--navy)}
.head p{margin:0;font-size:12.5px;color:var(--muted)}
.role-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#f1f5f9;padding:5px;border-radius:10px;margin-bottom:16px}
.role-btn{border:0;background:transparent;padding:9px;border-radius:8px;font-size:13px;font-weight:700;color:#475569;cursor:pointer}
.role-btn.active{background:#fff;color:var(--navy);box-shadow:0 2px 6px rgba(15,23,42,.1)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:700;color:#334155;margin-bottom:4px}
.field input{width:100%;padding:10px 12px;border:1.5px solid #cbd5e1;border-radius:8px;font-size:13.5px;outline:none}
.field input:focus{border-color:var(--blue)}
.row-between{display:flex;align-items:center;justify-content:space-between;font-size:12px;margin:8px 0 14px}
.link-btn{background:none;border:0;color:var(--blue);font-weight:700;cursor:pointer;padding:0;font-size:12px}
.btn-main{width:100%;padding:11px;border:0;border-radius:9px;background:var(--blue);color:#fff;font-size:14px;font-weight:800;cursor:pointer}
.btn-main:disabled{opacity:.6;cursor:not-allowed}
.btn-green{width:100%;padding:11px;border:0;border-radius:9px;background:var(--green);color:#fff;font-size:14px;font-weight:800;cursor:pointer;margin-top:8px}
.msg{margin-top:12px;padding:10px 12px;border-radius:8px;font-size:12.5px;display:none;line-height:1.45}
.msg.err{display:block;background:#fef2f2;color:var(--red);border:1px solid #fecaca}
.msg.ok{display:block;background:#f0fdf4;color:var(--green);border:1px solid #bbf7d0}
.offline-box{margin-top:12px;padding:10px;background:#f8fafc;border:1px dashed #94a3b8;border-radius:9px;text-align:center;display:none;font-size:12px}
.offline-box button{margin-top:6px;background:var(--navy);color:#fff;border:0;padding:8px 14px;border-radius:7px;font-weight:700;cursor:pointer}
.sub-links{margin-top:14px;padding-top:12px;border-top:1px solid #e2e8f0;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:12px}
.hidden{display:none!important}
</style>
</head>
<body>

  <!-- Animated Festival Banner (Controlled by Super Admin) -->
  <div id="loginFestivalBanner" class="festival-ribbon fest-theme-diwali">
    <div class="fest-title"><span class="fest-sparkle">✨</span> <span id="loginFestTitle"></span> <span class="fest-sparkle">✨</span></div>
    <div class="fest-sub" id="loginFestSub"></div>
  </div>

  <div class="card">
    <div class="head">
      <span class="pill-top">PATHOLOGY &amp; DIAGNOSTIC LIMS</span>
      <h1>ACD BITTU LAB CLOUD</h1>
      <p>Secure Single-Device &amp; Offline Hybrid Cloud Portal</p>
    </div>

    <!-- Role Selector (Hidden from normal Lab Owners; shown only for Super Admin email or ?admin=1) -->
    <div class="role-tabs" id="roleTabsBox" style="display:none;">
      <button type="button" class="role-btn active" id="tabLabOwner" onclick="switchRole('owner')">🧪 Lab Owner / Staff</button>
      <button type="button" class="role-btn" id="tabSuperAdmin" onclick="switchRole('admin')">⬟ Super Admin</button>
    </div>

    <!-- SIGN IN FORM -->
    <form id="signInForm">
      <div class="field">
        <label>Email Address</label>
        <input type="email" id="loginEmail" placeholder="Enter registered email" required autocomplete="username" oninput="checkSuperAdminEmailHint()">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Enter password" required autocomplete="current-password">
      </div>
      <div class="row-between">
        <label style="display:flex;align-items:center;gap:5px;cursor:pointer">
          <input type="checkbox" id="rememberEmail" checked> Remember Email
        </label>
        <button type="button" class="link-btn" onclick="handleForgotPassword()">Forgot Password?</button>
      </div>
      <button type="submit" class="btn-main" id="signInBtn">Sign In to Dashboard →</button>
    </form>

    <!-- NEW LAB OWNER SIGNUP FORM -->
    <form id="signUpForm" class="hidden">
      <div class="field">
        <label>Owner Full Name *</label>
        <input type="text" id="regOwnerName" placeholder="e.g. Dr. Rakesh Sharma" required>
      </div>
      <div class="field">
        <label>Laboratory / Diagnostic Center Name *</label>
        <input type="text" id="regLabName" placeholder="e.g. Saawariya Diagnostic" required>
      </div>
      <div class="field">
        <label>Owner Email *</label>
        <input type="email" id="regEmail" placeholder="owner@lab.com" required>
      </div>
      <div class="field">
        <label>Mobile Number *</label>
        <input type="tel" id="regPhone" placeholder="10-digit mobile number" required>
      </div>
      <div class="field">
        <label>Create Password *</label>
        <input type="password" id="regPassword" placeholder="Minimum 6 characters" required minlength="6">
      </div>
      <button type="submit" class="btn-green" id="signUpBtn">Create Lab Owner Account (3-Day Free Trial)</button>
      <div style="text-align:center;margin-top:10px">
        <button type="button" class="link-btn" onclick="toggleAuthMode('signin')">← Back to Sign In</button>
      </div>
    </form>

    <div id="statusMsg" class="msg"></div>

    <!-- Offline Mode Resume -->
    <div id="offlineBox" class="offline-box">
      <div><strong>Offline Mode Ready:</strong> This device is already authorized.</div>
      <button type="button" onclick="location.href='dashboard.html'">Open Offline Dashboard</button>
    </div>

    <div class="sub-links" id="footerLinks">
      <button type="button" class="link-btn" id="createAccountLink" onclick="toggleAuthMode('signup')">+ New Lab Owner? Create Account</button>
      <button type="button" class="link-btn" id="recoveryLink" style="display:none;color:#b45309" onclick="handleEmergencyRecovery()">Emergency Admin Recovery</button>
    </div>
  </div>

<script>
"use strict";
const SUPABASE_URL = "https://axfvvquhswapiwmvrepe.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_n6jRvVDjw2kOF7CS46omqQ_6qGkdR-q";
const SUPER_ADMIN_EMAIL = "deepakkumar70612440@gmail.com";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let selectedRole = "owner";

// Load Live Festival Greeting Banner
(async function loadFestivalBanner() {
  try {
    let fest = JSON.parse(localStorage.getItem("acd_festival_banner_cache") || "null");
    if (navigator.onLine) {
      const { data } = await db.from("saas_festival_banner").select("*").eq("id", 1).maybeSingle();
      if (data) {
        fest = data;
        localStorage.setItem("acd_festival_banner_cache", JSON.stringify(data));
      }
    }
    if (fest && fest.is_active && fest.title_text) {
      const box = document.getElementById("loginFestivalBanner");
      box.className = "festival-ribbon fest-theme-" + (fest.theme || "diwali");
      document.getElementById("loginFestTitle").textContent = fest.title_text;
      document.getElementById("loginFestSub").textContent = fest.sub_text || "";
      box.style.display = "block";
    }
  } catch (e) {}
})();

function getDeviceId() {
  let id = localStorage.getItem("acd_device_id");
  if (!id) {
    id = "DEV-" + crypto.randomUUID().slice(0, 12).toUpperCase();
    localStorage.setItem("acd_device_id", id);
  }
  return id;
}

function showMsg(text, isErr = true) {
  const el = document.getElementById("statusMsg");
  el.textContent = text;
  el.className = "msg " + (isErr ? "err" : "ok");
}

function switchRole(role) {
  selectedRole = role;
  document.getElementById("tabLabOwner").classList.toggle("active", role === "owner");
  document.getElementById("tabSuperAdmin").classList.toggle("active", role === "admin");
  document.getElementById("createAccountLink").style.display = role === "owner" ? "inline" : "none";
  document.getElementById("recoveryLink").style.display = role === "admin" ? "inline" : "none";
  toggleAuthMode("signin");
}

function toggleAuthMode(mode) {
  document.getElementById("signInForm").classList.toggle("hidden", mode !== "signin");
  document.getElementById("signUpForm").classList.toggle("hidden", mode !== "signup");
  document.getElementById("statusMsg").style.display = "none";
}

function checkSuperAdminEmailHint() {
  const val = (document.getElementById("loginEmail").value || "").trim().toLowerCase();
  const isAdminUrl = window.location.search.includes("admin=1");
  const show = (val === SUPER_ADMIN_EMAIL || isAdminUrl);
  document.getElementById("roleTabsBox").style.display = show ? "grid" : "none";
  if (!show && selectedRole === "admin") switchRole("owner");
}

(function initLoginState() {
  const savedEmail = localStorage.getItem("acd_remember_email");
  if (savedEmail) document.getElementById("loginEmail").value = savedEmail;
  checkSuperAdminEmailHint();
  if (localStorage.getItem("acd_offline_session")) {
    document.getElementById("offlineBox").style.display = "block";
  }
})();

// SIGN IN HANDLER
document.getElementById("signInForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!navigator.onLine) {
    showMsg("Internet connection is required for a new login. Use 'Open Offline Dashboard' below if already authorized.");
    return;
  }

  const email = document.getElementById("loginEmail").value.trim().toLowerCase();
  const password = document.getElementById("loginPassword").value;
  const btn = document.getElementById("signInBtn");
  const deviceId = getDeviceId();

  if (document.getElementById("rememberEmail").checked) {
    localStorage.setItem("acd_remember_email", email);
  }

  btn.disabled = true;
  btn.textContent = "Verifying Account & Device Lock...";
  document.getElementById("statusMsg").style.display = "none";

  try {
    const { data, error } = await db.auth.signInWithPassword({ email, password });
    if (error) throw error;

    const isSuper = (email === SUPER_ADMIN_EMAIL);

    const { data: prof } = await db.from("profiles").select("*").eq("id", data.user.id).maybeSingle();
    if (prof) {
      if (prof.is_active === false) {
        await db.auth.signOut();
        throw new Error("Your account has been suspended by Super Admin. Please contact support.");
      }
      if (!isSuper && prof.locked_device_id && prof.locked_device_id !== deviceId) {
        await db.auth.signOut();
        throw new Error("Single-Device Lock: This account is locked to another device (" + prof.locked_device_id + "). Contact Super Admin to reset.");
      }
      if (!prof.locked_device_id) {
        await db.from("profiles").update({
          locked_device_id: deviceId,
          last_login_at: new Date().toISOString()
        }).eq("id", data.user.id);
      }
    }

    if (!isSuper) {
      try {
        const { data: modeRow } = await db.from("platform_settings").select("value").eq("key", "platform_mode").maybeSingle();
        const isLive = modeRow && String(modeRow.value || "").toLowerCase() === "live";
        if (isLive) {
          const { data: subOverview } = await db.rpc("acd_owner_billing_overview");
          const ov = Array.isArray(subOverview) ? subOverview[0] : subOverview;
          const st = String(ov?.subscription_status || ov?.status || "").toLowerCase();
          if (st === "expired" || st === "past_due") {
            localStorage.setItem("acd_offline_session", JSON.stringify({ email, userId: data.user.id, deviceId }));
            location.href = "subscription.html";
            return;
          }
        }
      } catch (subErr) {}
    }

    localStorage.setItem("acd_offline_session", JSON.stringify({
      email,
      userId: data.user.id,
      isSuperAdmin: isSuper,
      deviceId,
      savedAt: Date.now()
    }));

    showMsg("Login verified! Opening dashboard...", false);
    setTimeout(() => { location.href = "dashboard.html"; }, 300);
  } catch (err) {
    showMsg(err.message || "Sign in failed.");
  } finally {
    btn.disabled = false;
    btn.textContent = "Sign In to Dashboard →";
  }
});

// NEW LAB OWNER SIGNUP
document.getElementById("signUpForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!navigator.onLine) {
    showMsg("Internet connection is required to create a new Lab Owner account.");
    return;
  }

  const ownerName = document.getElementById("regOwnerName").value.trim();
  const labName = document.getElementById("regLabName").value.trim();
  const email = document.getElementById("regEmail").value.trim().toLowerCase();
  const phone = document.getElementById("regPhone").value.trim();
  const password = document.getElementById("regPassword").value;
  const btn = document.getElementById("signUpBtn");

  btn.disabled = true;
  btn.textContent = "Creating Lab & Trial Account...";

  try {
    const { data: authData, error: signUpErr } = await db.auth.signUp({
      email,
      password,
      options: { data: { full_name: ownerName, lab_name: labName, phone } }
    });
    if (signUpErr) throw signUpErr;

    if (authData.user) {
      await db.rpc("acd_register_lab_owner", {
        p_user_id: authData.user.id,
        p_owner_name: ownerName,
        p_lab_name: labName,
        p_email: email,
        p_phone: phone,
        p_device_id: getDeviceId()
      });
    }

    showMsg("Lab Owner account created! Please check your email if verification is enabled, or Sign In now.", false);
    setTimeout(() => toggleAuthMode("signin"), 1800);
  } catch (err) {
    showMsg(err.message || "Signup failed.");
  } finally {
    btn.disabled = false;
    btn.textContent = "Create Lab Owner Account (3-Day Free Trial)";
  }
});

async function handleForgotPassword() {
  const email = document.getElementById("loginEmail").value.trim();
  if (!email) { showMsg("Please enter your registered email address first."); return; }
  const { error } = await db.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + "/index.html" });
  if (error) showMsg(error.message);
  else showMsg("Password reset link sent to " + email, false);
}

async function handleEmergencyRecovery() {
  const { error } = await db.auth.resetPasswordForEmail(SUPER_ADMIN_EMAIL, { redirectTo: window.location.origin + "/index.html" });
  if (error) showMsg(error.message);
  else showMsg("Emergency Super Admin recovery link sent to " + SUPER_ADMIN_EMAIL, false);
}
</script>
</body>
</html>
