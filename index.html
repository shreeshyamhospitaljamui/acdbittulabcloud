:root{--navy:#0f3460;--blue:#1b6ca8;--panel:#e8eef5;--border:#b8c7d9;--ink:#111;--green:#137333;--red:#b42318}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Segoe UI,Arial,sans-serif;font-size:12px;background:#dfe6ee;color:var(--ink)}
.hidden{display:none!important}
.menubar{background:var(--navy);color:#fff;padding:5px 12px;display:flex;justify-content:space-between;align-items:center}
.menu-links{display:flex;gap:4px;flex-wrap:wrap}
.menu-links button{background:transparent;border:1px solid transparent;color:#e2ecf7;padding:4px 9px;cursor:pointer;font-size:12px;border-radius:3px}
.menu-links button:hover,.menu-links button.active{background:#1e4d87;border-color:#4b7cb5;color:#fff;font-weight:700}
.toolbar{background:linear-gradient(#f8fafc,#dde5ef);border-bottom:1px solid var(--border);padding:5px 12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tbtn{background:#fff;border:1px solid #9db0c6;border-radius:4px;padding:5px 11px;cursor:pointer;font-weight:700;font-size:11px;color:#14365d}
.tbtn:hover{background:#eaf3fc;border-color:#1b6ca8}
.tbtn.primary{background:#1b6ca8;color:#fff;border-color:#124e7a}
.tbtn.success{background:#137333;color:#fff;border-color:#0d5224}
.tbtn.danger{background:#fff0ef;color:var(--red);border-color:#e5a9a4}
.status-pill{margin-left:auto;font-size:11px;padding:3px 9px;border-radius:12px;background:#fff;border:1px solid #b8c7d9;font-weight:700}
.login-box{max-width:400px;margin:55px auto;background:#fff;border:1px solid var(--border);border-radius:6px;padding:20px;box-shadow:0 4px 14px #00000018}
.field{margin-bottom:10px}
.field label{display:block;font-weight:700;margin-bottom:3px;font-size:11px;color:#283c54}
.inp{width:100%;padding:6px 8px;border:1px solid #9eb1c7;border-radius:3px;font:inherit;background:#fff}
.inp:focus{outline:2px solid #1b6ca8;background:#fffef0}
.workspace{padding:8px}
.erp-box{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:8px;margin-bottom:8px}
.erp-grid{display:grid;grid-template-columns:1.4fr 1.2fr 1fr;gap:8px}
.sub-card{background:#f7fafe;border:1px solid #c5d3e3;padding:7px;border-radius:3px}
.sub-card h4{margin:0 0 6px;font-size:11px;color:var(--navy);border-bottom:1px solid #d5e0ec;padding-bottom:3px;text-transform:uppercase}
.f-row{display:grid;grid-template-columns:95px 1fr;gap:5px;align-items:center;margin-bottom:5px}
.f-row label{font-weight:700;font-size:11px;color:#23374d}
.f-inline{display:flex;gap:4px}
.grid-wrap{background:#fff;border:1px solid #8fa4bd;height:calc(100vh - 335px);min-height:260px;overflow:auto}
table.erp-table{width:100%;border-collapse:collapse;font-size:12px}
table.erp-table th{position:sticky;top:0;background:linear-gradient(#26548a,#163861);color:#fff;padding:6px 8px;text-align:left;border:1px solid #3c6ca3;font-size:11px;z-index:2}
table.erp-table td{border:1px solid #cfd9e6;padding:4px 6px}
table.erp-table tr:nth-child(even){background:#f7faff}
table.erp-table input,table.erp-table select{width:100%;padding:4px 6px;border:1px solid #9db2c9;border-radius:2px;font-weight:700}
table.erp-table input:focus{background:#fff9c4;outline:2px solid #1b6ca8}
.bottom-bar{background:var(--panel);border:1px solid var(--border);padding:6px 10px;margin-top:6px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.card-panel{background:#fff;border:1px solid var(--border);border-radius:4px;padding:14px}
@media(max-width:900px){.erp-grid{grid-template-columns:1fr}.grid-wrap{height:auto;min-height:240px}}
</style>

function getDevId(){let id=localStorage.getItem(DEV_KEY);if(!id){id='DEV-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);localStorage.setItem(DEV_KEY,id);}return id;}
async function claimDevice(user){
  if(!navigator.onLine){
    const lk=JSON.parse(localStorage.getItem(LOCK_CACHE)||'null');
    if(lk&&lk.userId===user.id&&lk.devId===getDevId())return true;
    throw new Error('Offline mode: Sirf pehle se locked active device hi offline khulega.');
  }
  const {data,error}=await client.rpc('acd_claim_single_device_session',{p_device_id:getDevId(),p_device_label:navigator.userAgent.slice(0,100)});
  if(error)throw error;
  if(!(data===true||data?.allowed===true))throw new Error('Blocked: Yeh ID doosre device par login hai! Wahan se logout karein ya Super Admin se Force Reset karwayein.');
  localStorage.setItem(LOCK_CACHE,JSON.stringify({userId:user.id,devId:getDevId()}));
  if(devTimer)clearInterval(devTimer);
  devTimer=setInterval(async()=>{
    if(!navigator.onLine||!currentUser)return;
    const {data:ok}=await client.rpc('acd_heartbeat_single_device_session',{p_device_id:getDevId()});
    if(ok===false||ok?.allowed===false){clearInterval(devTimer);localStorage.removeItem(LOCK_CACHE);await client.auth.signOut();location.reload();}
  },25000);
}

document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(!e.target.matches('.nav-enter'))return;
  e.preventDefault();
  const list=[...document.querySelectorAll('.nav-enter:not([disabled]):not([readonly])')];
  const i=list.indexOf(e.target);
  if(i>=0&&i<list.length-1){list[i+1].focus();list[i+1].select?.();}
  else if(i===list.length-1){$('tbSave')?.click();}
});

function calcRange(p,ageVal,ageUnit,sex){
  const y=ageUnit==='days'?ageVal/365:ageUnit==='months'?ageVal/12:ageVal;
  if(ageVal>0&&y<12&&p.child)return p.child;
  if(sex==='Male'&&p.male)return p.male;
  if(sex==='Female'&&p.female)return p.female;
  return p.general||'';
}

  </div></div>
  <div class="grid-wrap"><table class="erp-table">
    <thead><tr><th style="width:20%">Test Name</th><th style="width:22%">Sub Test / Parameter</th><th style="width:18%">Result (Press Enter ↓)</th><th style="width:12%">Unit</th><th style="width:20%">Normal Value</th><th style="width:8%">Action</th></tr></thead>
    <tbody id="erpGridBody"><tr><td colspan="6" style="text-align:center;padding:30px;color:#666">Select a test above and click ADD (or press Enter) to load parameters here.</td></tr></tbody>
  </table></div>
  <div class="bottom-bar">
    <div><b>Total Tests: <span id="testCountLbl">0</span></b> · <span id="entryStatus" style="color:var(--green);font-weight:700">Ready</span></div>
    <div>Tip: Press <b>Enter</b> inside any Result box to jump directly to the next parameter!</div>
  </div>`;

  const recalcBill=()=>{
    const tot=entryTests.reduce((s,t)=>s+Number(t.price||0),0);
    const net=Math.max(0,tot-Number($('bDisc').value||0));
    $('bTotal').value=net;
    $('bDue').value=Math.max(0,net-Number($('bPaid').value||0));
  };
  $('bDisc').oninput=recalcBill; $('bPaid').oninput=recalcBill;

  const paintGrid=()=>{
    $('testCountLbl').textContent=entryTests.length; recalcBill();
    const tb=$('erpGridBody');
    if(!entryTests.length){tb.innerHTML='<tr><td colspan="6" style="text-align:center;padding:30px;color:#666">No tests added yet.</td></tr>';return;}
    const age=Number($('pAge').value||0), unit=$('pAgeUnit').value, sex=$('pSex').value;
    let html='';
    entryTests.forEach((t,ti)=>{
      t.parameters.forEach((p,pi)=>{
        const norm=calcRange(p,age,unit,sex); p.activeRange=norm;
        const inp=p.options
          ? `<select class="nav-enter res-cell" data-ti="${ti}" data-pi="${pi}"><option value="">Select</option>${p.options.split(',').map(o=>`<option ${p.val===o.trim()?'selected':''}>${esc(o.trim())}</option>`).join('')}</select>`
          : `<input class="nav-enter res-cell" data-ti="${ti}" data-pi="${pi}" value="${esc(p.val||'')}" placeholder="Result">`;
        html+=`<tr><td>${pi===0?`<b>${esc(t.name)}</b>`:''}</td><td>${esc(p.name)}</td><td>${inp}</td><td>${esc(p.unit||'')}</td><td>${esc(norm)}</td><td>${pi===0?`<button class="tbtn danger" type="button" data-del-test="${ti}">X</button>`:''}</td></tr>`;
      });
    });
    tb.innerHTML=html;
    tb.querySelectorAll('.res-cell').forEach(el=>el.oninput=()=>{entryTests[el.dataset.ti].parameters[el.dataset.pi].val=el.value;});
    tb.querySelectorAll('[data-del-test]').forEach(b=>b.onclick=()=>{entryTests.splice(Number(b.dataset.delTest),1);paintGrid();});
  };

  const addSelectedTest=()=>{
    const name=$('testPicker').value.trim();
    const found=store.tests.find(t=>t.name.toLowerCase()===name.toLowerCase());
    if(!found)return alert('Test catalogue mein nahi mila! Pehle Test Catalogue se Load Master Tests karein.');
    entryTests.push(JSON.parse(JSON.stringify(found)));
    $('testPicker').value=''; paintGrid();
    setTimeout(()=>document.querySelector('.res-cell')?.focus(),50);
  };
  $('addTestBtn').onclick=addSelectedTest;
  $('testPicker').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addSelectedTest();}};
  ['pAge','pAgeUnit','pSex'].forEach(id=>$(id).onchange=paintGrid);
  if(entryTests.length)paintGrid();
}

async function saveCurrentEntry(){
  const pName=$('pName')?.value.trim();
  if(!pName)return alert('Patient Name zaroori hai!');
  if(!entryTests.length)return alert('Kam se kam 1 test add karein!');
  const doc=$('pDoc').value.trim();
  if(doc&&!store.doctors.includes(doc)){store.doctors.push(doc);saveStore();}
  const order={
    id:$('pLabNo').value, lab_id:activeLab?.id||'local', patient_name:pName,
    patient_age:$('pAge').value+' '+$('pAgeUnit').value, patient_gender:$('pSex').value,
    patient_mobile:$('pMobile').value, patient_address:$('pAddr').value, referrer:doc,
    items:entryTests, total:Number($('bTotal').value||0), discount:Number($('bDisc').value||0),
    paid:Number($('bPaid').value||0), due:Number($('bDue').value||0),
    payment_method:$('bMode').value, created_at:new Date().toISOString(), syncStatus:'pending'
  };
  await idbPut('orders',order);
  if(navigator.onLine&&activeLab?.id){
    const {error}=await client.from('acd_lab_orders').upsert({
      id:order.id,lab_id:activeLab.id,patient_id:order.id,patient_name:order.patient_name,
      patient_age:order.patient_age,patient_gender:order.patient_gender,patient_mobile:order.patient_mobile,
      patient_address:order.patient_address,referrer:order.referrer,items:order.items,
      subtotal:order.total+order.discount,discount:order.discount,total:order.total,
      paid:order.paid,due:order.due,payment_method:order.payment_method,
      payment_status:order.due>0?'Partial':'Paid',status:'Completed',created_at:order.created_at,updated_at:order.created_at
    },{onConflict:'id'});
    if(!error){order.syncStatus='synced';await idbPut('orders',order);}
  }
  $('entryStatus').textContent='Saved ('+order.syncStatus+')';
  return order;
}

function printA4Report(order){
  let frame=$('printFrame');
  if(!frame){frame=document.createElement('iframe');frame.id='printFrame';frame.style.display='none';document.body.appendChild(frame);}
  const L=store.lab;
  const rowsHtml=order.items.map(t=>`
    <h4 style="margin:10px 0 4px;background:#eef3f8;padding:4px 6px;border-left:3px solid #0f3460">${esc(t.name)}</h4>
    <table style="width:100%;border-collapse:collapse;font-size:11px">
      <thead><tr style="background:#f4f6f9"><th style="border:1px solid #999;padding:4px;text-align:left">Parameter</th><th style="border:1px solid #999;padding:4px;text-align:left">Result</th><th style="border:1px solid #999;padding:4px;text-align:left">Unit</th><th style="border:1px solid #999;padding:4px;text-align:left">Reference Range</th></tr></thead>
      <tbody>${t.parameters.map(p=>`<tr><td style="border:1px solid #bbb;padding:4px">${esc(p.name)}</td><td style="border:1px solid #bbb;padding:4px;font-weight:700">${esc(p.val||'-')}</td><td style="border:1px solid #bbb;padding:4px">${esc(p.unit||'')}</td><td style="border:1px solid #bbb;padding:4px">${esc(p.activeRange||p.general||'')}</td></tr>`).join('')}</tbody>
    </table>`).join('');
  const doc=frame.contentWindow.document;
  doc.open();
  doc.write(`<!doctype html><html><head><style>@page{size:A4;margin:12mm}body{font-family:Arial,sans-serif;color:#111;margin:0}.hdr{text-align:center;border-bottom:2px solid #0f3460;padding-bottom:6px;margin-bottom:8px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:4px;border:1px solid #aaa;padding:6px;font-size:11px;margin-bottom:8px}.sigs{display:flex;justify-content:space-between;margin-top:35px;font-size:11px;text-align:center}</style></head><body>
    <div class="hdr"><h2 style="margin:0;color:#0f3460">${esc(L.headerTitle||L.name||activeLab?.name||'PATHOLOGY LABORATORY')}</h2><div>${esc(L.address||activeLab?.address||'')} · ${esc(L.phone||activeLab?.phone||'')}</div></div>
    <div class="meta"><div><b>Patient:</b> ${esc(order.patient_name)}</div><div><b>Lab No:</b> ${esc(order.id)}</div><div><b>Age / Sex:</b> ${esc(order.patient_age)} / ${esc(order.patient_gender)}</div><div><b>Date:</b> ${new Date(order.created_at).toLocaleString()}</div><div><b>Ref. Doctor:</b> ${esc(order.referrer||'Self')}</div><div><b>Bill:</b> Total ${money(order.total)} | Paid ${money(order.paid)} | Due ${money(order.due)}</div></div>
    ${rowsHtml}
    <div class="sigs"><div><b>${esc(L.techName||'Lab Technician')}</b><br>${esc(L.techQual||'DMLT')}</div><div><b>${esc(L.docName||'Authorized Pathologist')}</b><br>${esc(L.docQual||'MD Pathology')}</div></div>
  </body></html>`);
  doc.close();
  setTimeout(()=>{frame.contentWindow.focus();frame.contentWindow.print();},200);
}

async function switchTab(tab){
  document.querySelectorAll('#topMenu button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  const w=$('mainWorkspace');
  if(tab==='Entry'){renderEntryScreen();return;}
  if(tab==='Reports'){
    const list=(await idbAll('orders')).reverse();
    w.innerHTML=`<div class="card-panel"><h3>Saved Reports & Print History (${list.length})</h3>
    <table class="erp-table"><thead><tr><th>Lab No</th><th>Patient</th><th>Tests</th><th>Total / Due</th><th>Status</th><th>Action</th></tr></thead>
    <tbody>${list.map(o=>`<tr><td>${esc(o.id)}</td><td><b>${esc(o.patient_name)}</b> (${esc(o.patient_age)})</td><td>${o.items.map(x=>esc(x.name)).join(', ')}</td><td>${money(o.total)} / Due: ${money(o.due)}</td><td>${esc(o.syncStatus)}</td><td><button class="tbtn primary" data-pr="${esc(o.id)}">Print A4</button></td></tr>`).join('')}</tbody></table></div>`;
    w.querySelectorAll('[data-pr]').forEach(b=>b.onclick=()=>{const o=list.find(x=>x.id===b.dataset.pr);if(o)printA4Report(o);});
    return;
  }
  if(tab==='Catalogue'){
    w.innerHTML=`<div class="card-panel">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <h3 style="margin:0">Master Test Catalogue (${store.tests.length} Tests)</h3>
        <button class="tbtn success" id="loadCleanCat">⚡ Reset & Load Original 24-Param CBC + Clean Master Tests</button>
      </div>
      <table class="erp-table"><thead><tr><th>Test Name</th><th>Sample</th><th>Parameters</th><th>Rate (₹)</th></tr></thead>
      <tbody>${store.tests.map((t,i)=>`<tr><td><b>${esc(t.name)}</b></td><td>${esc(t.sampleType)}</td><td>${t.parameters.length} parameters</td><td><input class="inp" style="width:90px" type="number" value="${t.price}" data-rate="${i}"></td></tr>`).join('')}</tbody></table>
    </div>`;
    $('loadCleanCat').onclick=async()=>{
      if(!confirm('Purane adhoore tests hata kar Original 24-Parameter CBC aur Clean Master Catalogue load karein?'))return;
      store.tests=JSON.parse(JSON.stringify(MASTER_CATALOGUE));saveStore();
      if(navigator.onLine&&activeLab?.id){
        await client.from('acd_lab_tests').delete().eq('lab_id',activeLab.id);
        for(const t of store.tests)await client.from('acd_lab_tests').insert({id:uid('TST'),lab_id:activeLab.id,name:t.name,price:t.price,sample_type:t.sampleType,parameters:t.parameters,is_active:true});
      }
      alert('Clean Master Catalogue (Original 24-Param CBC ke saath) load ho gaya!');switchTab('Catalogue');
    };
    w.querySelectorAll('[data-rate]').forEach(inp=>inp.onchange=()=>{store.tests[inp.dataset.rate].price=Number(inp.value||0);saveStore();});
    return;
  }
  if(tab==='Accounts'){
    const list=await idbAll('orders');
    const tot=list.reduce((s,o)=>s+Number(o.total||0),0), paid=list.reduce((s,o)=>s+Number(o.paid||0),0), due=list.reduce((s,o)=>s+Number(o.due||0),0);
    w.innerHTML=`<div class="card-panel"><h3>Accounts & Billing Summary</h3><p><b>Total Billed:</b> ${money(tot)} | <b>Total Paid (Jama):</b> ${money(paid)} | <b style="color:var(--red)">Total Due (Bakaya):</b> ${money(due)}</p></div>`;
    return;
  }
  if(tab==='Setup'){
    const L=store.lab;
    w.innerHTML=`<div class="card-panel"><h3>Lab & Report Print Setup (A-to-Z Customization)</h3>
      <div class="erp-grid">
        <div class="field"><label>Lab Header Title</label><input class="inp" id="sTitle" value="${esc(L.headerTitle||L.name||activeLab?.name||'')}"></div>
        <div class="field"><label>Address</label><input class="inp" id="sAddr" value="${esc(L.address||activeLab?.address||'')}"></div>
        <div class="field"><label>Phone</label><input class="inp" id="sPhone" value="${esc(L.phone||activeLab?.phone||'')}"></div>
        <div class="field"><label>Pathologist / Doctor Name</label><input class="inp" id="sDoc" value="${esc(L.docName||'')}"></div>
        <div class="field"><label>Doctor Qualification</label><input class="inp" id="sDocQ" value="${esc(L.docQual||'MBBS, MD')}"></div>
        <div class="field"><label>Lab Technician Name</label><input class="inp" id="sTech" value="${esc(L.techName||'')}"></div>
      </div>
      <button class="tbtn success" id="saveSetupBtn">Save Lab & Print Settings</button>
    </div>`;
    $('saveSetupBtn').onclick=()=>{Object.assign(store.lab,{headerTitle:$('sTitle').value,address:$('sAddr').value,phone:$('sPhone').value,docName:$('sDoc').value,docQual:$('sDocQ').value,techName:$('sTech').value});saveStore();alert('Settings Saved!');};
    return;
  }
  if(tab==='SuperAdmin'){
    const {data:labs}=await client.from('cloud_labs').select('*').order('created_at',{ascending:false});
    w.innerHTML=`<div class="card-panel"><h3>👑 Super Admin A-to-Z Master Control</h3>
      <p>Kisi bhi lab ko <b>Open & Customize</b> karein ya kisi user ka <b>Force Device Reset</b> karein.</p>
      <table class="erp-table"><thead><tr><th>Lab Name</th><th>Address / Phone</th><th>Status</th><th>A-to-Z Actions</th></tr></thead>
      <tbody>${(labs||[]).map(l=>`<tr><td><b>${esc(l.name)}</b></td><td>${esc(l.address||'')} · ${esc(l.phone||'')}</td><td>${l.is_active?'Active':'Inactive'}</td>
      <td><button class="tbtn primary" data-open-lab="${esc(l.id)}" data-lab-name="${esc(l.name)}">Open & Customize Lab</button></td></tr>`).join('')}</tbody></table>
    </div>`;
    w.querySelectorAll('[data-open-lab]').forEach(b=>b.onclick=()=>{activeLab={id:b.dataset.openLab,name:b.dataset.labName};$('labTitleBar').textContent='SUPER ADMIN EDITING: '+activeLab.name;switchTab('Entry');});
  }
}

$('toggleReg').onclick=()=>$('regForm').classList.toggle('hidden');
$('loginForm').onsubmit=async e=>{
  e.preventDefault();$('loginBtn').disabled=true;$('authMsg').textContent='';
  try{const {data,error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;await bootWorkspace(data.user);}
  catch(err){$('authMsg').textContent=err.message;}finally{$('loginBtn').disabled=false;}
};
$('regForm').onsubmit=async e=>{
  e.preventDefault();const fd=new FormData(e.target);
  try{const {data,error}=await client.auth.signUp({email:fd.get('regEmail'),password:fd.get('regPassword')});if(error)throw error;if(data.session)await client.rpc('register_lab_workspace',{p_lab_name:fd.get('labName'),p_address:fd.get('labAddress')||'',p_phone:fd.get('labPhone')||''});alert('Lab Account Created! Please Sign In.');$('regForm').classList.add('hidden');}
  catch(err){$('authMsg').textContent=err.message;}
};
$('tbLogout').onclick=async()=>{if(navigator.onLine&&currentUser)await client.rpc('acd_release_single_device_session',{p_device_id:getDevId()}).catch(()=>{});localStorage.removeItem(LOCK_CACHE);await client.auth.signOut();location.reload();};
$('tbNew').onclick=()=>{entryTests=[];editingOrderId=null;switchTab('Entry');};
$('tbSave').onclick=()=>saveCurrentEntry();
$('tbPrint').onclick=async()=>{const o=await saveCurrentEntry();if(o)printA4Report(o);};
$('tbWhatsApp').onclick=async()=>{const o=await saveCurrentEntry();if(o)window.open(`https://wa.me/${String(o.patient_mobile||'').replace(/\D/g,'')}?text=${encodeURIComponent('Lab Report Ready: '+o.patient_name+' | Lab No: '+o.id+' | Total: '+money(o.total))}`,'_blank');};
$('tbSync').onclick=async()=>{
  if(!navigator.onLine)return alert('Aap abhi Offline hain. Internet aate hi sync ho jayega.');
  const all=await idbAll('orders');let n=0;
  for(const o of all.filter(x=>x.syncStatus!=='synced')){
    const {error}=await client.from('acd_lab_orders').upsert({id:o.id,lab_id:activeLab.id,patient_id:o.id,patient_name:o.patient_name,items:o.items,total:o.total,paid:o.paid,due:o.due,created_at:o.created_at,updated_at:new Date().toISOString()},{onConflict:'id'});
    if(!error){o.syncStatus='synced';await idbPut('orders',o);n++;}
  }
  alert(n+' offline reports cloud par sync ho gayi!');
};
document.querySelectorAll('#topMenu button').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));

async function bootWorkspace(user){
  await claimDevice(user);currentUser=user;
  if(!store.tests.length){store.tests=JSON.parse(JSON.stringify(MASTER_CATALOGUE));saveStore();}
  const {data:prof}=await client.from('profiles').select('platform_role').eq('id',user.id).maybeSingle();
  platformRole=prof?.platform_role||'';
  if(platformRole==='super_admin')$('saTab').classList.remove('hidden');
  const {data:mems}=await client.from('cloud_memberships').select('*').eq('user_id',user.id).eq('is_active',true);
  if(mems?.length){const {data:lab}=await client.from('cloud_labs').select('*').eq('id',mems[0].lab_id).maybeSingle();activeLab=lab;}
  $('loginView').classList.add('hidden');$('appView').classList.remove('hidden');$('labTitleBar').textContent=activeLab?.name||(platformRole==='super_admin'?'SUPER ADMIN CONSOLE':'Lab Workspace');
  switchTab(platformRole==='super_admin'&&!activeLab?'SuperAdmin':'Entry');
}
const updNet=()=>{$('netBadge').textContent=navigator.onLine?'🟢 ONLINE':'🟠 OFFLINE MODE';};
window.addEventListener('online',updNet);window.addEventListener('offline',updNet);updNet();
(async()=>{db=await openDB();const {data}=await client.auth.getSession();if(data.session)bootWorkspace(data.session.user).catch(e=>{$('authMsg').textContent=e.message;});})();
</script>
