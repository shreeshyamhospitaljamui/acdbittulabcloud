<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ACD BITTU LAB CLOUD — Enterprise Pathology LIMS</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0f294a" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0b1f3a 0%, #163a6b 55%, #0f294a 100%);
      color: #0f172a; padding: 16px;
    }

    /* Animated Shimmer & Sparkle Festival Banner */
    .festival-ribbon {
      width: 100%; max-width: 540px; margin-bottom: 16px; border-radius: 14px;
      padding: 12px 18px; text-align: center; color: #fff; position: relative; overflow: hidden;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35); border: 1.5px solid rgba(255, 255, 255, 0.45);
      display: none; animation: festFloat 3s ease-in-out infinite;
    }
    .festival-ribbon::before {
      content: ""; position: absolute; top: 0; left: -120%; width: 90%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.38), transparent);
      transform: skewX(-22deg); animation: festShine 2.8s infinite;
    }
    .fest-theme-diwali { background: linear-gradient(135deg, #b45309, #ea580c, #d97706); }
    .fest-theme-durga  { background: linear-gradient(135deg, #991b1b, #dc2626, #b91c1c); }
    .fest-theme-holi   { background: linear-gradient(135deg, #7e22ce, #db2777, #2563eb); }
    .fest-theme-eid    { background: linear-gradient(135deg, #065f46, #059669, #0d9488); }
    .fest-theme-gold   { background: linear-gradient(135deg, #1e3a8a, #1d4ed8, #0284c7); }
    .fest-title { font-size: 15.5px; font-weight: 800; letter-spacing: 0.3px; text-shadow: 0 2px 6px rgba(0,0,0,0.35); }
    .fest-sub { font-size: 12px; opacity: 0.95; margin-top: 3px; }
    .fest-sparkle { display: inline-block; animation: festPulse 1.3s alternate infinite; }

    @keyframes festShine { 0% { left: -120%; } 65%, 100% { left: 160%; } }
    @keyframes festFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes festPulse { from { transform: scale(0.92); opacity: 0.85; } to { transform: scale(1.18); opacity: 1; } }

    .login-card {
      width: 100%; max-width: 440px; background: #ffffff; border-radius: 16px;
      padding: 32px 28px; box-shadow: 0 24px 60px rgba(0,0,0,0.35);
    }
    .brand { text-align: center; margin-bottom: 22px; }
    .brand-badge {
      display: inline-block; background: #eff6ff; color: #1d4ed8; font-weight: 700;
      font-size: 11px; padding: 4px 10px; border-radius: 999px; letter-spacing: 0.5px;
    }
    .brand h1 { margin: 8px 0 4px; font-size: 22px; color: #0f294a; }
    .brand p { margin: 0; font-size: 13px; color: #64748b; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12px; font-weight: 600; color: #334155; margin-bottom: 5px; }
    .field input {
      width: 100%; padding: 11px 13px; border: 1.5px solid #cbd5e1; border-radius: 9px;
      font-size: 14px; outline: none; transition: border-color 0.2s;
    }
    .field input:focus { border-color: #1d4ed8; }
    .btn-primary {
      width: 100%; padding: 12px; border: none; border-radius: 9px; background: #1d4ed8;
      color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 6px;
    }
    .btn-primary:hover { background: #1e40af; }
    .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; }
    .status-box {
      margin-top: 14px; padding: 10px 12px; border-radius: 8px; font-size: 13px;
      display: none; line-height: 1.45;
    }
    .status-err { display: block; background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .status-ok { display: block; background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
    .offline-resume {
      margin-top: 14px; padding: 12px; background: #f8fafc; border: 1px dashed #94a3b8;
      border-radius: 10px; text-align: center; display: none;
    }
    .offline-resume button {
      margin-top: 8px; background: #0f294a; color: #fff; border: none; padding: 9px 16px;
      border-radius: 7px; font-weight: 600; cursor: pointer;
    }
    .footer-note { text-align: center; margin-top: 18px; font-size: 11.5px; color: #64748b; }
  </style>
</head>
<body>

  <!-- Animated Festival Greeting Banner -->
  <div id="loginFestivalBanner" class="festival-ribbon fest-theme-diwali">
    <div class="fest-title"><span class="fest-sparkle">✨</span> <span id="loginFestTitle"></span> <span class="fest-sparkle">✨</span></div>
    <div class="fest-sub" id="loginFestSub"></div>
  </div>

  <div class="login-card">
    <div class="brand">
      <span class="brand-badge">INDIA'S #1 ENTERPRISE PATHOLOGY LIMS</span>
      <h1>ACD BITTU LAB CLOUD</h1>
      <p>Cloud + Offline Hybrid Diagnostic Console</p>
    </div>

    <form id="loginForm">
      <div class="field">
        <label>Registered Email ID</label>
        <input type="email" id="email" placeholder="lab@example.com" required autocomplete="username" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn-primary" id="loginBtn">Sign In to LIMS Console</button>
    </form>

    <div id="statusBox" class="status-box"></div>

    <div id="offlineResumeBox" class="offline-resume">
      <div style="font-size:12.5px;color:#334155;font-weight:600;">
        Authorized Device Detected (Offline Mode Available)
      </div>
      <button type="button" id="resumeOfflineBtn">Open Authorized Offline Console</button>
    </div>

    <div class="footer-note">
      Single-Device Protected &bull; Auto-Cloud Sync &bull; NABL Ready
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://axfvvquhswapiwmvrepe.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_n6jRvVDjw2kOF7CS46omqQ_6qGkdR-q";
    const SUPER_ADMIN_EMAIL = "acdbittu@gmail.com";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Load Live Festival Greeting Banner on Login Screen
    (async function loadFestivalBanner() {
      try {
        if (!navigator.onLine) return;
        const { data } = await sb.from("saas_festival_banner").select("*").eq("id", 1).single();
        if (data && data.is_active && data.title_text) {
          const box = document.getElementById("loginFestivalBanner");
          box.className = "festival-ribbon fest-theme-" + (data.theme || "diwali");
          document.getElementById("loginFestTitle").textContent = data.title_text;
          document.getElementById("loginFestSub").textContent = data.sub_text || "";
          box.style.display = "block";
        }
      } catch (e) {}
    })();

    function getOrCreateDeviceId() {
      let did = localStorage.getItem("acd_device_fingerprint");
      if (!did) {
        did = "DEV-" + crypto.randomUUID().slice(0, 12).toUpperCase();
        localStorage.setItem("acd_device_fingerprint", did);
      }
      return did;
    }

    function showStatus(msg, isError = true) {
      const box = document.getElementById("statusBox");
      box.textContent = msg;
      box.className = "status-box " + (isError ? "status-err" : "status-ok");
    }

    (function checkOfflineSession() {
      const cachedSession = localStorage.getItem("acd_offline_auth_bundle");
      if (cachedSession && !navigator.onLine) {
        document.getElementById("offlineResumeBox").style.display = "block";
      }
      document.getElementById("resumeOfflineBtn").addEventListener("click", () => {
        window.location.href = "dashboard.html";
      });
    })();

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!navigator.onLine) {
        showStatus("New login requires an active internet connection so your license and single-device lock can be verified.", true);
        return;
      }

      const btn = document.getElementById("loginBtn");
      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = document.getElementById("password").value;
      const deviceId = getOrCreateDeviceId();

      btn.disabled = true;
      btn.textContent = "Verifying License & Device...";
      showStatus("", false);
      document.getElementById("statusBox").style.display = "none";

      try {
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;

        const isSuperAdmin = (email === SUPER_ADMIN_EMAIL);

        if (!isSuperAdmin) {
          const { data: labs, error: labErr } = await sb
            .from("labs")
            .select("*")
            .eq("owner_email", email)
            .limit(1);

          if (labErr) throw labErr;
          if (!labs || labs.length === 0) {
            await sb.auth.signOut();
            throw new Error("No pathology center is linked to this email. Contact Super Admin.");
          }

          const lab = labs[0];

          if (lab.is_locked) {
            await sb.auth.signOut();
            throw new Error("ACCOUNT SUSPENDED BY ADMIN: " + (lab.lock_reason || "Payment due or administrative hold."));
          }

          if (lab.active_device_id && lab.active_device_id !== deviceId) {
            await sb.auth.signOut();
            throw new Error("DEVICE LOCKED: This account is already registered on another computer (" + lab.active_device_id + "). Ask Super Admin to reset Device Lock.");
          }

          if (!lab.active_device_id) {
            await sb.from("labs").update({
              active_device_id: deviceId,
              active_device_info: navigator.platform + " | " + new Date().toLocaleDateString()
            }).eq("id", lab.id);
          }

          localStorage.setItem("acd_offline_auth_bundle", JSON.stringify({
            email,
            userId: data.user.id,
            labId: lab.id,
            deviceId,
            isLocked: !!lab.is_locked,
            lockReason: lab.lock_reason || "",
            subscriptionEnd: lab.subscription_end || "2099-12-31",
            planTier: lab.plan_tier || "standard",
            featureFlags: lab.feature_flags || {},
            lastVerifiedEpoch: Date.now()
          }));
        } else {
          localStorage.setItem("acd_offline_auth_bundle", JSON.stringify({
            email,
            userId: data.user.id,
            isSuperAdmin: true,
            deviceId,
            lastVerifiedEpoch: Date.now()
          }));
        }

        showStatus("Verified! Opening LIMS Console...", false);
        setTimeout(() => { window.location.href = "dashboard.html"; }, 350);
      } catch (err) {
        showStatus(err.message || "Login failed.", true);
      } finally {
        btn.disabled = false;
        btn.textContent = "Sign In to LIMS Console";
      }
    });
  </script>
</body>
</html>
