<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ACD BITTU LAB CLOUD — Desktop LIMS</title>
<style>
:root{--navy:#0f3460;--blue:#1769aa;--panel:#eaf0f6;--border:#bfd0e2;--ink:#132338;--green:#0e7a3a;--red:#b42318;--bg:#dfe6ef}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Segoe UI,Arial,sans-serif;font-size:12px;background:var(--bg);color:var(--ink)}
.hidden{display:none!important}
.topbar{background:var(--navy);color:#fff;padding:6px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #092240}
.topbar h1{margin:0;font-size:14px;letter-spacing:.4px}
.topbar small{color:#bfd6f2;font-size:11px}
.toolbar{background:linear-gradient(#f9fbfd,#dce5f0);border-bottom:1px solid var(--border);padding:5px 12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tbtn{background:#fff;border:1px solid #96acc4;border-radius:4px;padding:5px 10px;cursor:pointer;font-weight:700;font-size:11px;color:#12355c;display:inline-flex;align-items:center;gap:4px}
.tbtn:hover{background:#e7f2fc;border-color:var(--blue)}
.tbtn.primary{background:var(--blue);color:#fff;border-color:#0f4c7d}
.tbtn.success{background:var(--green);color:#fff;border-color:#0a5729}
.tbtn.danger{background:#fff0ef;color:var(--red);border-color:#e4a5a0}
.pill{margin-left:auto;padding:3px 9px;border-radius:12px;background:#fff;border:1px solid var(--border);font-weight:700;font-size:11px}
.shell{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:calc(100vh - 68px)}
.sidebar{background:#123966;color:#e3eefb;padding:8px;display:flex;flex-direction:column;gap:3px;border-right:1px solid #0b2647}
.sidebar button{background:transparent;border:1px solid transparent;color:#dce9f8;text-align:left;padding:7px 9px;border-radius:4px;cursor:pointer;font-size:12px;font-weight:600}
.sidebar button:hover,.sidebar button.active{background:#1e528d;border-color:#4b82bf;color:#fff}
.main{padding:10px;overflow-x:auto}
.login-card{max-width:410px;margin:45px auto;background:#fff;border:1px solid var(--border);border-radius:6px;padding:20px;box-shadow:0 4px 16px #00000018}
.field{margin-bottom:9px}
.field label{display:block;font-weight:700;font-size:11px;margin-bottom:3px;color:#273b52}
.inp{width:100%;padding:6px 8px;border:1px solid #9ab0c7;border-radius:3px;font:inherit;background:#fff}
.inp:focus{outline:2px solid var(--blue);background:#fffef0}
.erp-box{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:8px;margin-bottom:8px}
.erp-grid{display:grid;grid-template-columns:1.35fr 1.25fr 1fr;gap:8px}
.sub-card{background:#f8fbff;border:1px solid #c3d3e4;padding:7px;border-radius:3px;position:relative}
.sub-card h4{margin:0 0 6px;font-size:11px;color:var(--navy);border-bottom:1px solid #d5e1ee;padding-bottom:3px;text-transform:uppercase}
.frow{display:grid;grid-template-columns:92px 1fr;gap:5px;align-items:center;margin-bottom:5px}
.frow label{font-weight:700;font-size:11px}
.finline{display:flex;gap:4px}
.search-drop{position:absolute;left:7px;right:7px;top:100%;background:#fff;border:1px solid #7f9bb8;border-radius:4px;max-height:190px;overflow-y:auto;z-index:20;box-shadow:0 6px 16px #00000025}
.search-item{padding:6px 9px;border-bottom:1px solid #eef2f7;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.search-item:hover,.search-item.hi{background:#e6f2fc;font-weight:700}
.grid-box{background:#fff;border:1px solid #8ea4be;height:calc(100vh - 345px);min-height:250px;overflow:auto}
table.grid{width:100%;border-collapse:collapse;font-size:12px}
table.grid th{position:sticky;top:0;background:linear-gradient(#245388,#15375f);color:#fff;padding:6px 7px;text-align:left;border:1px solid #3c6ca3;font-size:11px;z-index:2}
table.grid td{border:1px solid #cfd9e6;padding:4px 6px}
table.grid tr:nth-child(even){background:#f7faff}
table.grid input,table.grid select{width:100%;padding:4px 6px;border:1px solid #9bb0c8;border-radius:2px;font-weight:700}
table.grid input:focus{background:#fff9c4;outline:2px solid var(--blue)}
.panel{background:#fff;border:1px solid var(--border);border-radius:4px;padding:12px;margin-bottom:10px}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:4px;padding:10px}
.stat-card b{font-size:18px;color:var(--navy);display:block;margin-top:3px}
.notice{background:#fff6db;border:1px solid #ebd082;color:#6e4f09;padding:8px 10px;border-radius:4px;margin-bottom:10px;font-size:11px}
@media(max-width:850px){.shell{grid-template-columns:1fr}.sidebar{flex-direction:row;overflow-x:auto}.erp-grid,.stats-row{grid-template-columns:1fr}.grid-box{height:auto;min-height:230px}}
</style>
</head>
<body>

<div id="loginView" class="login-card">
  <h2 style="margin:0 0 3px;color:var(--navy)">ACD BITTU LAB CLOUD</h2>
  <div style="color:#555;margin-bottom:12px">Desktop & Cloud Pathology LIMS</div>
  <div class="notice">Single-Device Security: Online hone par naye device par login karte hi purana device automatic logout ho jayega.</div>
  <form id="loginForm">

    <div class="field"><label>Password</label><input class="inp" id="password" type="password" required></div>
    <button class="tbtn primary" style="width:100%;justify-content:center;padding:8px" id="loginBtn" type="submit">SIGN IN TO WORKSPACE</button>
  </form>
  <div style="margin-top:10px;display:flex;gap:6px">
    <button class="tbtn" type="button" id="toggleReg">Register New Lab</button>
  </div>
  <form id="regForm" class="hidden" style="margin-top:10px;border-top:1px solid #ddd;padding-top:10px">

    <div class="field"><label>Lab Name</label><input class="inp" name="labName" required></div>
    <div class="field"><label>Address</label><input class="inp" name="labAddress"></div>
    <div class="field"><label>Mobile</label><input class="inp" name="labPhone"></div>
    <div class="field"><label>Email</label><input class="inp" name="regEmail" type="email" required></div>
    <div class="field"><label>Password (Min 8 chars)</label><input class="inp" name="regPassword" type="password" minlength="8" required></div>
    <button class="tbtn success" type="submit">Create Lab Workspace</button>
  </form>
  <div id="authMsg" style="margin-top:8px;color:var(--red);font-weight:700"></div>
</div>

<div id="appView" class="hidden">
  <div class="topbar">
    <div><h1>ACD BITTU LAB CLOUD</h1><small id="labHeaderMeta">Desktop LIMS Workspace</small></div>
    <div style="display:flex;gap:8px;align-items:center">
      <span id="userBadge" style="font-size:11px;color:#cfe2f7"></span>
      <button class="tbtn danger" id="btnLogout">Exit / Logout</button>
    </div>
  </div>
  <div class="toolbar">
    <button class="tbtn" id="tbNew">＋ New Entry</button>
    <button class="tbtn success" id="tbSave">💾 Save Report</button>
    <button class="tbtn primary" id="tbPrint">🖨 Direct A4 Print</button>
    <button class="tbtn" id="tbWhatsApp">📲 WhatsApp</button>
    <button class="tbtn" id="tbSync">🔄 Sync Cloud</button>
    <span class="pill" id="netStatus">Checking...</span>
  </div>
  <div class="shell">
    <aside class="sidebar" id="sideNav">
      <button data-page="Entry" class="active">＋ New Patient & Entry</button>
      <button data-page="Reports">✓ Saved Reports</button>
      <button data-page="Catalogue">🧪 Test Catalogue</button>
      <button data-page="Samples">🧬 Sample Tracking</button>
      <button data-page="Accounts">₹ Accounts & Expenses</button>
      <button data-page="Inventory">📦 Inventory & Stock</button>
      <button data-page="Staff">♙ Staff & Roles</button>
      <button data-page="Setup">⚙ Lab & Print Setup</button>
      <button data-page="Subscription">💳 Subscription & Razorpay</button>
      <button data-page="Backup">▣ Backup & Cloud Sync</button>
      <button data-page="SuperAdmin" id="navSuperAdmin" class="hidden">👑 Super Admin Control</button>
    </aside>
    <main class="main" id="mainArea"></main>
  </div>
</div>
